{% extends "base.html" %}
{% from "_macros.html" import card %}
{% block title %}Anmelden · Energie{% endblock %}
{% block body %}
<main class="flex min-h-screen items-center justify-center p-4">
  {% call card('w-full max-w-sm') %}
    <h1 class="text-lg font-semibold">Energie-Dashboard</h1>
    <form method="post" class="mt-4 space-y-4">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label class="block text-sm">
        <span class="text-slate-600">Passwort</span>
        <input type="password" name="password" required autofocus autocomplete="current-password"
               class="mt-1 block w-full rounded-md border border-slate-300 p-2 focus:border-slate-500 focus:outline-none">
      </label>
      {% if error %}<p class="text-sm text-red-600">{{ error }}</p>{% endif %}
      <button class="w-full rounded-md bg-slate-800 p-2 text-sm font-medium text-white hover:bg-slate-700">Anmelden</button>
    </form>
  {% endcall %}
</main>
{% endblock %}
